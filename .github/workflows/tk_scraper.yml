name: TK Auto Inventory Scraper

on:
  schedule:
    # 每天每 2 小时自动运行一次抓取任务 (UTC 时间)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        # 因为你的文件在根目录，所以直接运行
        run: python scrape_tk.py

      - name: Commit and Push Inventory Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tk_inventory.json
          if git diff --staged --quiet; then
            echo "No changes in inventory."
          else
            git commit -m "chore(auto): sync latest tk inventory and prices [skip ci]"
            git push
          fi
